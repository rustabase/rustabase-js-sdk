# Builds, tests, and publishes the rustabase JS SDK to npm.
#
# Trigger: a GitHub Release is published (which also creates the git tag vV).
# Also runnable manually from the Actions tab.
#
# Setup (one-time):
#   1. Add a repository secret named NPM_TOKEN containing an npm access token
#      with "Publish" permission (npmjs.com -> Access Tokens -> Classic token,
#      Automation type, or a Granular token scoped to this package).
#   2. Enable 2FA on the npm account and, if using Granular tokens, allow
#      publishing to the package.
#   3. Make the repo public (required for npm provenance and recommended for an#
#      open-source SDK).
#   4. To release: bump version in package.json + CHANGELOG.md, commit, tag as
#      vX.Y.Z, push the tag, then publish a GitHub Release for that tag.

name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: bun run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
